name: "새 기능 (Feature)"
description: "기존에 없던 새로운 기능 추가"
labels: ["feature"]
body:
  - type: textarea
    id: motivation
    attributes:
      label: 배경
      description: 누가 어떤 상황에서 필요한지, 지금은 그 상황을 어떻게 해결하고 있는지 적어주세요.
    validations:
      required: true
  - type: textarea
    id: desired
    attributes:
      label: 바라는 동작
      description: 어떻게 동작해야 하는지 사용자 입장에서 적어주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안
      description: 생각해 둔 구현 방향이 있다면 적어주세요. 검토하다 고르지 않은 대안이 있으면 그 이유도 함께 적어주세요.
    validations:
      required: false
  - type: textarea
    id: out-of-scope
    attributes:
      label: 스코프 제외
      description: 이번엔 하지 않는 것과 그 이유. 관련 이슈가 있다면 링크를 넣어주세요.
    validations:
      required: false
  - type: textarea
    id: related-files
    attributes:
      label: 관련 파일
      description: 이 기능과 관련된 파일 경로
      placeholder: |
        - path/to/file
    validations:
      required: false
