name: "버그 (Bug)"
description: "의도대로 동작하지 않는 것"
labels: ["bug"]
body:
  - type: textarea
    id: symptom
    attributes:
      label: 증상
      description: 무엇이 잘못 동작하는가. 발견 경위도 함께 적어주세요
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: 정상이라면 어떻게 동작해야 하는가
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 재현 절차
      description: 재현할 수 있다면 순서대로. 코드를 보다 발견한 것이라면 비워둬도 됩니다
      value: |
        1.
    validations:
      required: false
  - type: textarea
    id: cause
    attributes:
      label: 원인
      description: 파악했다면 적어주세요. 몰라도 됩니다
    validations:
      required: false
  - type: textarea
    id: impact
    attributes:
      label: 영향 범위
      description: 누가, 무엇이, 얼마나 영향을 받는가. 이미 쌓인 데이터가 있다면 그 규모도
    validations:
      required: false
  - type: textarea
    id: proposal
    attributes:
      label: 제안 해결법
      description: 떠오르는 방향이 있다면. 디버깅하면서 다시 확인할 부분이라 확정이 아니어도 됩니다
    validations:
      required: false
  - type: textarea
    id: out-of-scope
    attributes:
      label: 스코프 제외
      description: 이번엔 하지 않는 것과 그 이유. 관련 이슈가 있다면 링크
    validations:
      required: false
  - type: textarea
    id: related-files
    attributes:
      label: 관련 파일
      description: 이 버그와 관련된 파일 경로
      placeholder: |
        - path/to/file
    validations:
      required: false
