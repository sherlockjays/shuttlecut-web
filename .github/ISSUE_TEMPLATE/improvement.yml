name: "개선 (Improvement)"
description: "기존에 있는 기능 개선(사용자가 알아챌 수 있는 개선: UI/UX, 성능 등)"
labels: ["improvement"]
body:
  - type: textarea
    id: current
    attributes:
      label: 현재 동작
      description: 지금은 어떻게 동작하는지 적어주세요.
    validations:
      required: true
  - type: textarea
    id: desired
    attributes:
      label: 바라는 동작
      description: 어떻게 바뀌면 좋을지 사용자 입장에서 적어주세요.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 이유
      description: 사용자가 겪는 불편이나 발견하게 된 계기 등, 바꿔야 하는 이유를 적어주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안
      description: 생각해 둔 방향이 있다면 적어주세요. 검토하다 고르지 않은 대안이 있으면 그 이유도 함께 적어주세요.
    validations:
      required: false
  - type: textarea
    id: out-of-scope
    attributes:
      label: 스코프 제외
      description: 이번엔 하지 않는 것과 그 이유. 관련 이슈가 있다면 링크를 넣어주세요.
    validations:
      required: false
  - type: textarea
    id: related-files
    attributes:
      label: 관련 파일
      description: 이 개선과 관련된 파일 경로
      placeholder: |
        - path/to/file
    validations:
      required: false
