services:

  frontend:
    build: ./frontend
    image: 'shuttlecut-web-frontend:${IMAGE_TAG:?IMAGE_TAG를 root .env에 넣어주세요. (로컬 환경: "dev", NAS 환경: 배포 커밋의 SHA)}'
    restart: unless-stopped
    ports:
      - "3000:80"

  backend:
    build: ./backend
    image: 'shuttlecut-web-backend:${IMAGE_TAG:?IMAGE_TAG를 root .env에 넣어주세요. (로컬 환경: "dev", NAS 환경: 배포 커밋의 SHA)}'
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      TZ: Asia/Seoul
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL을 root .env에 넣어주세요}
      REDIS_URL: ${REDIS_URL:?REDIS_URL을 root .env에 넣어주세요}
      STORAGE_PATH: ${STORAGE_PATH:?STORAGE_PATH를 root .env에 넣어주세요}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY를 root .env에 넣어주세요}
      WORKER_SECRET: ${WORKER_SECRET:?WORKER_SECRET을 root .env에 넣어주세요. 워커 PC의 .env.native-worker와 같은 값이어야 합니다}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL을 root .env에 넣어주세요}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    volumes:
      - video_data:/data/videos
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "15432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB를 root .env에 넣어주세요. DATABASE_URL 안의 DB 이름과 같아야 합니다}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER를 root .env에 넣어주세요. DATABASE_URL 안의 사용자와 같아야 합니다}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 root .env에 넣어주세요}
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD를 root .env에 넣어주세요. REDIS_URL 안의 비밀번호와 같아야 합니다}

volumes:
  pg_data:
  video_data:
