services:
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.local-worker
    env_file:
      - .env.local-worker
    environment:
      TZ: Asia/Seoul
      ENABLE_GPU: "1"
      ENABLE_OPENCL: "0"
      ENABLE_NVDEC: "0"
      LD_LIBRARY_PATH: /usr/lib/wsl/lib
    volumes:
      - /usr/lib/wsl/lib:/usr/lib/wsl/lib:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
