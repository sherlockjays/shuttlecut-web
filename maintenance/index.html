<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShuttleCut - 점검 중</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      padding: 2rem;
      max-width: 480px;
    }

    .logo {
      font-size: 1.75rem;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: -0.5px;
      margin-bottom: 2.5rem;
    }

    .logo span {
      color: #ffffff;
    }

    .icon {
      font-size: 3.5rem;
      margin-bottom: 1.5rem;
      animation: spin 3s linear infinite;
      display: inline-block;
    }

    @keyframes spin {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #f1f5f9;
      margin-bottom: 0.75rem;
    }

    p {
      font-size: 0.95rem;
      color: #94a3b8;
      line-height: 1.7;
      margin-bottom: 0.5rem;
    }

    .divider {
      width: 40px;
      height: 2px;
      background: #38bdf8;
      margin: 1.75rem auto;
      border-radius: 2px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 999px;
      padding: 0.4rem 1rem;
      font-size: 0.8rem;
      color: #94a3b8;
      margin-top: 2rem;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #fbbf24;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">Shuttle<span>Cut</span></div>
    <div class="icon">⚙️</div>
    <h1>잠시 점검 중입니다</h1>
    <p>더 나은 서비스를 위해 시스템을 개선하고 있습니다.</p>
    <p>곧 다시 돌아올게요!</p>
    <div class="divider"></div>
    <p style="font-size:0.85rem;">불편을 드려 죄송합니다.<br/>작업 완료 후 바로 서비스를 재개할 예정입니다.</p>
    <div class="status">
      <div class="dot"></div>
      점검 진행 중
    </div>
  </div>
</body>
</html>
