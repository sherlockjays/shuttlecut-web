services:
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.gpu
    command: celery -A workers.tasks.celery worker --loglevel=info --concurrency=1
    environment:
      TZ: Asia/Seoul
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      STORAGE_PATH: /data/exports
      GCS_BUCKET: ${GCS_BUCKET}
      GOOGLE_APPLICATION_CREDENTIALS: /app/gcs-key.json
      ENABLE_GPU: "1"
    volumes:
      - /tmp/shuttlecut-exports:/data/exports
      - /opt/shuttlecut/gcs-key.json:/app/gcs-key.json:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
